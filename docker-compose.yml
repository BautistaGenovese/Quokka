version: '3.8'

services:
  db:
    image: postgres:15
    container_name: portfolio_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Qu0kk4_PgSql_2026_x9K7m!}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_integrador}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
